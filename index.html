<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кубкрафтер — текущие заказы</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,440;9..144,560;9..144,680&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDE7DA;
    --surface:#F8F5EE;
    --ink:#2A2521;
    --ink-muted:#7A7060;
    --line:#D9D0BC;
    --accent:#3F5D54;
    --accent-pale:#C9D3C6;
    --warn:#B23A2E;
    --warn-pale:#EAD3CE;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"IBM Plex Sans", sans-serif;
    min-height:100vh;
    padding:32px 28px 80px;
  }
  h1,h2,h3{font-family:"Fraunces", serif; font-weight:560; margin:0;}

  header.top{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
    max-width:1240px;
    margin:0 auto 28px;
    border-bottom:1px solid var(--line);
    padding-bottom:18px;
  }
  header.top .mark{font-size:15px; color:var(--ink-muted); letter-spacing:.01em;}
  header.top h1{font-size:26px; margin-top:2px;}
  button.add-btn{
    background:var(--ink);
    color:var(--surface);
    border:none;
    font-family:"IBM Plex Sans", sans-serif;
    font-size:14px;
    font-weight:500;
    padding:11px 18px;
    cursor:pointer;
    border-radius:3px;
  }
  button.add-btn:hover{background:var(--accent);}

  .grid{
    max-width:1240px;
    margin:0 auto;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(290px, 1fr));
    gap:20px;
  }

  .card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:2px;
    padding:26px 22px 20px;
  }
  .card.dragging{ opacity:.45; }
  .dot-btn{
    position:absolute;
    top:17px; left:15px;
    width:11px; height:11px;
    border-radius:50%;
    background:var(--bg);
    border:1.5px solid var(--line);
    padding:0;
    cursor:pointer;
  }
  .dot-btn:hover{border-color:var(--accent);}
  .color-menu{
    display:none;
    position:absolute;
    top:32px; left:14px;
    z-index:5;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:4px;
    padding:7px;
    gap:6px;
    grid-template-columns:repeat(4, 18px);
    box-shadow:0 3px 10px rgba(42,37,33,.12);
  }
  .color-menu.open{display:grid;}
  .color-menu .swatch{
    width:18px; height:18px;
    border-radius:50%;
    border:1px solid var(--line);
    padding:0;
    cursor:pointer;
  }
  .color-menu .swatch:hover{border-color:var(--ink);}
  .card .top-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    margin-left:22px;
  }
  .card h2{font-size:18px; line-height:1.25; font-weight:560; padding-right:4px;}
  .card-actions{display:flex; align-items:center; gap:2px; flex-shrink:0;}
  .menu-btn{
    background:none; border:none; color:var(--ink-muted);
    font-size:17px; line-height:1; cursor:pointer; padding:2px 5px;
  }
  .menu-btn:hover{color:var(--ink);}
  .card-menu{
    display:none; position:absolute; top:38px; right:14px; z-index:6;
    background:var(--surface); border:1px solid var(--line); border-radius:4px;
    min-width:170px; padding:6px; box-shadow:0 4px 14px rgba(42,37,33,.14);
  }
  .card-menu.open{display:block;}
  .card-menu button{
    display:block; width:100%; text-align:left; background:none; border:none;
    font-family:"IBM Plex Sans", sans-serif; font-size:13px; color:var(--ink);
    padding:7px 9px; border-radius:3px; cursor:pointer;
  }
  .card-menu button:hover{background:var(--bg);}
  .rename-input{
    font-family:"Fraunces", serif; font-weight:560; font-size:18px;
    color:var(--ink); background:var(--bg); border:1px solid var(--accent);
    border-radius:3px; padding:2px 6px; width:100%;
  }
  .rename-input:focus{outline:none;}
  .drag-handle{
    color:var(--ink-muted);
    font-size:15px;
    letter-spacing:1px;
    cursor:grab;
    line-height:1;
    padding:2px 4px;
    flex-shrink:0;
    user-select:none;
    touch-action:none;
  }
  .drag-handle:active{cursor:grabbing;}

  .dates{
    margin:14px 0 16px 22px;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--ink-muted);
  }
  .dates input[type=date]{
    font-family:"IBM Plex Sans", sans-serif;
    font-size:13px;
    color:var(--ink);
    background:transparent;
    border:none;
    border-bottom:1px dashed var(--line);
    padding:1px 0;
    width:104px;
  }
  .dates input[type=date]:focus{outline:none; border-bottom-color:var(--accent);}
  .dates .arrow{color:var(--line);}
  .dates{margin-bottom:8px;}
  .workdays{
    margin:0 0 16px 22px;
    display:flex; align-items:center; gap:7px;
    font-size:13px; color:var(--ink-muted);
  }
  .workdays input{
    width:52px;
    font-family:"IBM Plex Sans", sans-serif;
    font-size:13px; font-weight:600;
    color:var(--ink);
    text-align:center;
    background:rgba(255,255,255,.45);
    border:1px solid var(--line);
    border-radius:3px;
    padding:3px 4px;
    -moz-appearance:textfield;
  }
  .workdays input::-webkit-outer-spin-button,
  .workdays input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  .workdays input:focus{outline:none; border-color:var(--accent);}

  .stage-row{margin:0 0 14px 22px;}
  .stage-select{
    appearance:none;
    -webkit-appearance:none;
    font-family:"IBM Plex Sans", sans-serif;
    font-size:12.5px;
    font-weight:500;
    color:var(--accent);
    background:var(--accent-pale);
    border:1px solid var(--accent);
    border-radius:13px;
    padding:5px 26px 5px 11px;
    cursor:pointer;
    background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0l5 6 5-6z" fill="%233F5D54"/></svg>');
    background-repeat:no-repeat;
    background-position:right 10px center;
    max-width:100%;
  }

  .progress-wrap{margin-left:22px;}
  .bar-track{
    height:10px;
    background:#EDE7DA;
    border:1px solid var(--line);
    border-radius:5px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    border-radius:5px 0 0 5px;
    min-width:3px;
  }
  .progress-note{
    margin-top:7px;
    font-size:12.5px;
    color:var(--ink-muted);
  }
  .progress-note .pct{
    font-weight:600;
    color:var(--ink);
  }
  .progress-note.warn{color:var(--warn);}
  .progress-note.missing{font-style:normal;}

  .empty-state{
    max-width:1240px; margin:60px auto; text-align:center;
    color:var(--ink-muted); font-size:14px;
  }

  /* add-card */
  .add-card{
    background:var(--surface);
    border:1px dashed var(--line);
    border-radius:2px;
    padding:22px;
  }
  .add-card h3{font-size:15px; margin-bottom:14px; font-weight:560;}
  .add-card label{display:block; font-size:12.5px; color:var(--ink-muted); margin:10px 0 4px;}
  .add-card input[type=text], .add-card input[type=date], .add-card select{
    width:100%;
    font-family:"IBM Plex Sans", sans-serif;
    font-size:14px;
    padding:8px 9px;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--bg);
    color:var(--ink);
  }
  .add-card .btn-row{display:flex; gap:10px; margin-top:16px;}
  .add-card button{
    flex:1;
    font-family:"IBM Plex Sans", sans-serif;
    font-size:13.5px;
    font-weight:500;
    padding:9px;
    border-radius:3px;
    cursor:pointer;
    border:1px solid var(--line);
    background:var(--bg);
    color:var(--ink);
  }
  .add-card button.save{background:var(--ink); color:var(--surface); border-color:var(--ink);}
  .add-card button.save:hover{background:var(--accent); border-color:var(--accent);}

  .banner{
    max-width:1240px; margin:0 auto 24px; padding:14px 18px;
    background:var(--warn-pale); border:1px solid var(--warn);
    color:var(--warn); font-size:13.5px; border-radius:3px;
  }

  /* задачи */
  .tasks{
    margin:16px 0 0 22px;
    padding-top:12px;
    border-top:1px solid var(--line);
  }
  .tasks-label{
    font-size:11.5px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-muted); margin-bottom:6px;
  }
  .task{
    display:flex; align-items:flex-start; gap:8px;
    padding:3px 0;
  }
  .task input[type=checkbox]{
    margin:4px 0 0; width:14px; height:14px; flex-shrink:0;
    accent-color:var(--accent); cursor:pointer;
  }
  .task-text, .task-new{
    flex:1; min-width:0;
    font-family:"IBM Plex Sans", sans-serif;
    font-size:13.5px; line-height:1.4;
    color:var(--ink);
    background:transparent;
    border:none;
    border-bottom:1px solid transparent;
    padding:1px 0;
    resize:none;
    overflow:hidden;
  }
  .task-text:focus, .task-new:focus{outline:none; border-bottom-color:var(--accent);}
  .task.done .task-text{text-decoration:line-through; color:var(--ink-muted);}
  .task-del{
    background:none; border:none; padding:0 2px; cursor:pointer;
    color:var(--ink-muted); font-size:16px; line-height:1.2;
    opacity:0; flex-shrink:0;
  }
  .task:hover .task-del, .task-del:focus{opacity:1;}
  .task-del:hover{color:var(--warn);}
  @media (hover:none){ .task-del{opacity:.6;} }
  .task-new{
    display:block; width:100%; margin-top:4px;
    border-bottom:1px dashed var(--line);
  }
  .task-new::placeholder{color:var(--ink-muted);}

  @media (prefers-reduced-motion: no-preference){
    .bar-fill{transition:width .4s ease;}
  }

  /* ---- секции ниже карточек ---- */
  .section-block{max-width:1240px; margin:56px auto 0;}
  .section-head{
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:14px;
    border-bottom:1px solid var(--line);
    padding-bottom:14px; margin-bottom:20px;
  }
  .section-head h2{font-size:19px;}

  .filter-wrap{position:relative;}
  .zoom-wrap{display:flex; gap:4px;}
  .zoom-btn{
    width:30px; height:30px;
    background:var(--surface); border:1px solid var(--line); color:var(--ink);
    font-size:16px; font-weight:600; border-radius:3px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .zoom-btn:hover{border-color:var(--accent);}
  .zoom-btn:active{background:var(--bg);}
  .filter-btn{
    background:var(--surface); border:1px solid var(--line); color:var(--ink);
    font-family:"IBM Plex Sans", sans-serif; font-size:13px; font-weight:500;
    padding:8px 14px; border-radius:3px; cursor:pointer;
  }
  .filter-btn:hover{border-color:var(--accent);}
  .filter-menu{
    display:none; position:absolute; top:calc(100% + 6px); right:0; z-index:6;
    background:var(--surface); border:1px solid var(--line); border-radius:4px;
    min-width:250px; padding:6px; box-shadow:0 4px 14px rgba(42,37,33,.14);
  }
  .filter-menu.open{display:block;}
  .filter-menu button{
    display:block; width:100%; text-align:left; background:none; border:none;
    font-family:"IBM Plex Sans", sans-serif; font-size:13px; color:var(--ink);
    padding:8px 10px; border-radius:3px; cursor:pointer;
  }
  .filter-menu button:hover{background:var(--bg);}
  .filter-menu button.active{color:var(--accent); font-weight:600;}

  /* ---- диаграмма Ганта ---- */
  .gantt-scroll{overflow-x:auto; padding-bottom:8px;}
  .gantt-chart{position:relative; width:max-content;}
  .gantt-empty{font-size:13.5px; color:var(--ink-muted); padding:20px 0;}
  .gantt-header-row{display:flex; height:24px; margin-bottom:4px;}
  .gantt-header-spacer{width:190px; flex-shrink:0; position:sticky; left:0; background:var(--bg); z-index:3;}
  .gantt-header-track{position:relative;}
  .gantt-tick{position:absolute; top:0; bottom:-6px; border-left:1px dashed var(--line);}
  .gantt-tick span{position:absolute; top:0; left:4px; font-size:10.5px; color:var(--ink-muted); white-space:nowrap;}
  .gantt-row{display:flex; align-items:center; height:34px; border-bottom:1px solid var(--line);}
  .gantt-row:last-child{border-bottom:none;}
  .gantt-label{
    position:sticky; left:0; z-index:2;
    width:190px; flex-shrink:0;
    background:var(--bg);
    font-size:12.5px; padding-right:12px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .gantt-track{position:relative; height:100%;}
  .gantt-bar{
    position:absolute; top:7px; height:20px; border-radius:4px;
    opacity:.92; cursor:default;
  }
  .gantt-nodate{position:absolute; top:9px; left:8px; font-size:11.5px; color:var(--ink-muted); font-style:italic;}
  .gantt-today{position:absolute; top:-24px; bottom:0; width:2px; background:var(--warn); z-index:1; opacity:.7;}

  /* ---- доска задач ---- */
  .tasks-board{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(240px,1fr));
    gap:16px;
  }
  .board-col{
    background:var(--surface); border:1px solid var(--line); border-radius:3px;
    padding:14px; min-height:120px;
  }
  .board-col-title{
    font-size:11.5px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-muted); margin-bottom:10px; padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .board-col-body{min-height:60px; display:flex; flex-direction:column; gap:8px; padding-left:38px;}
  .board-empty{font-size:12.5px; color:var(--ink-muted); font-style:italic; padding:4px 0;}
  .board-task{
    position:relative;
    background:var(--bg); border:1px solid var(--line); border-radius:3px;
    padding:9px 10px; cursor:grab; touch-action:none;
    display:flex; align-items:flex-start; gap:8px; flex-wrap:wrap;
  }
  .board-task-num{
    position:absolute; left:-34px; top:50%; transform:translateY(-50%);
    width:18px; text-align:right;
    font-size:11px; font-weight:600; color:var(--ink-muted);
  }
  .board-task:active{cursor:grabbing;}
  .board-task.dragging{opacity:.4;}
  .board-task input[type=checkbox]{margin-top:2px; accent-color:var(--accent); cursor:pointer; flex-shrink:0;}
  .board-task-text{flex:1; min-width:100px; font-size:13px; line-height:1.4;}
  .board-task.done .board-task-text{text-decoration:line-through; color:var(--ink-muted);}
  .board-task-tag{
    font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:9px;
    background:var(--accent-pale); color:var(--ink); white-space:nowrap;
    flex-shrink:0;
  }
</style>
</head>
<body>

<header class="top">
  <div>
    <div class="mark">Кубкрафтер</div>
    <h1>Текущие заказы</h1>
  </div>
  <button class="add-btn" id="openAddBtn">Добавить заказ</button>
</header>

<div id="banner"></div>
<div class="grid" id="grid"></div>
<div class="empty-state" id="emptyState" style="display:none;">Нет активных заказов — добавьте первый.</div>

<section class="section-block" id="ganttSection">
  <div class="section-head">
    <h2>Диаграмма Ганта</h2>
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="zoom-wrap">
        <button class="zoom-btn" id="ganttZoomOut" title="Уменьшить масштаб">−</button>
        <button class="zoom-btn" id="ganttZoomIn" title="Увеличить масштаб">+</button>
      </div>
      <div class="filter-wrap">
      <button class="filter-btn" id="ganttFilterBtn">Сортировка: <span id="ganttFilterLabel">как в карточках</span> ▾</button>
      <div class="filter-menu" id="ganttFilterMenu">
        <button data-sort="manual">Как в карточках (вручную)</button>
        <button data-sort="due-asc">Срочность — сначала горящие</button>
        <button data-sort="due-desc">Срочность — сначала дальние</button>
        <button data-sort="dur-asc">Длительность — сначала короткие</button>
        <button data-sort="dur-desc">Длительность — сначала длинные</button>
        <button data-sort="stage-asc">Стадия — сначала ранние</button>
      </div>
      </div>
    </div>
  </div>
  <div class="gantt-scroll">
    <div class="gantt-chart" id="ganttChart"></div>
  </div>
</section>

<section class="section-block" id="tasksBoardSection">
  <div class="section-head">
    <h2>Задачи по исполнителям</h2>
  </div>
  <div class="tasks-board" id="tasksBoard">
    <div class="board-col" data-zone="unassigned">
      <div class="board-col-title">Нераспределённые задачи</div>
      <div class="board-col-body" data-zone-body="unassigned"></div>
    </div>
    <div class="board-col" data-zone="workshop">
      <div class="board-col-title">Цех</div>
      <div class="board-col-body" data-zone-body="workshop"></div>
    </div>
    <div class="board-col" data-zone="office">
      <div class="board-col-title">Офис</div>
      <div class="board-col-body" data-zone-body="office"></div>
    </div>
    <div class="board-col" data-zone="contractors">
      <div class="board-col-title">Подрядчики</div>
      <div class="board-col-body" data-zone-body="contractors"></div>
    </div>
  </div>
</section>

<script type="module">
  const firebaseConfig = {
    apiKey: "AIzaSyCbVFoap7xG21nw0fYh0Qvb7wH_rsTINt0",
    authDomain: "doska-projects.firebaseapp.com",
    projectId: "doska-projects",
    storageBucket: "doska-projects.firebasestorage.app",
    messagingSenderId: "565838014099",
    appId: "1:565838014099:web:b3ddd51edb198142df8f66"
  };

  const STAGES = [
    "Договор и предоплата",
    "Замер",
    "Техзадание",
    "Проектирование",
    "Согласование проекта",
    "Закупка материалов",
    "Производство",
    "Доставка в цех",
    "Сборка",
    "Доставка",
    "Монтаж",
    "Сдано"
  ];
  const DONE_STAGE = STAGES.length; // 12

  const CARD_COLORS = [
    {label:'Без цвета', value:null},
    {label:'Шалфей',    value:'#DCE6D9'},
    {label:'Небо',      value:'#D8E3E8'},
    {label:'Песок',     value:'#EFE2C9'},
    {label:'Роза',      value:'#EAD6D2'},
    {label:'Слива',     value:'#E1D7E3'},
    {label:'Глина',     value:'#E7CBB8'},
    {label:'Мох',       value:'#CBD6C2'}

  function fmtDate(iso){
    if(!iso) return null;
    const [y,m,d] = iso.split('-');

  function parseLocal(iso){
    const [y,m,d] = iso.split('-').map(Number);

  }
  // Считает рабочие дни (пн–пт) строго между датами, не включая начальную и включая конечную.
  function workingDaysBetween(from, to){
    let count = 0;
    const cur = new Date(from);
    cur.setDate(cur.getDate()+1);
    while(cur <= to){
      const day = cur.getDay();
      if(day !== 0 && day !== 6) count++;
      cur.setDate(cur.getDate()+1);
    }
    return count;
  }

  function toIso(d){
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), dd = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${dd}`;
  }
  // Дата, до которой укладывается N рабочих дней после даты начала (та же логика, что в workingDaysBetween)
  function addWorkingDays(startIso, n){
    const cur = parseLocal(startIso);
    let left = n;
    while(left > 0){
      cur.setDate(cur.getDate()+1);
      const day = cur.getDay();
      if(day !== 0 && day !== 6) left--;
    }
    return toIso(cur);
  }
  function effectiveWorkDays(p){
    if(Number.isFinite(p.workDays) && p.workDays > 0) return p.workDays;
    if(p.startDate && p.dueDate){
      const n = workingDaysBetween(parseLocal(p.startDate), parseLocal(p.dueDate));
      return n > 0 ? n : null;
    }
    return null;
  }

  function computeProgress(p){
    if(!p.startDate || !p.dueDate){
      return {mode:'missing'};
    }
    const start = parseLocal(p.startDate);
    const due = parseLocal(p.dueDate);
    const today = new Date();
    today.setHours(0,0,0,0);
    const totalWD = workingDaysBetween(start, due); // всего рабочих дней на проект
    if(totalWD <= 0){
      return {mode:'invalid'};
    }
    if(due < today){
      return {mode:'overdue', daysOver: workingDaysBetween(due, today)};
    }
    const spentWD = workingDaysBetween(start, today); // сколько рабочих дней уже прошло
    const daysLeft = workingDaysBetween(today, due);
    const pct = Math.min(100, Math.max(0, (spentWD/totalWD)*100));
    return {mode:'ok', pct, daysLeft};
  }

  // ---- диаграмма Ганта ----
  function renderGantt(){
    const ganttChart = document.getElementById('ganttChart');
    if(!ganttChart) return;
    if(currentVisible.length === 0){
      ganttChart.innerHTML = '<div class="gantt-empty">Нет текущих заказов.</div>';
      return;
    }
    const dated = currentVisible.filter(p => p.startDate && p.dueDate && parseLocal(p.dueDate) >= parseLocal(p.startDate));
    if(dated.length === 0){
      ganttChart.innerHTML = '<div class="gantt-empty">Ни у одного заказа не указаны обе даты — нечего строить.</div>';
      return;
    }

    let minStart = parseLocal(dated[0].startDate);
    let maxDue = parseLocal(dated[0].dueDate);
    dated.forEach(p => {
      const s = parseLocal(p.startDate), d = parseLocal(p.dueDate);
      if(s < minStart) minStart = s;
      if(d > maxDue) maxDue = d;
    });
    const totalDays = Math.round((maxDue - minStart)/86400000) + 1;
    const chartWidth = totalDays * ganttDayWidth;

    let sorted = currentVisible.slice();
    if(ganttSort === 'due-asc'){
      sorted.sort((a,b) => (a.dueDate||'9999-99-99').localeCompare(b.dueDate||'9999-99-99'));
    } else if(ganttSort === 'due-desc'){
      sorted.sort((a,b) => (b.dueDate||'').localeCompare(a.dueDate||''));
    } else if(ganttSort === 'dur-asc' || ganttSort === 'dur-desc'){
      const dur = p => (p.startDate && p.dueDate) ? workingDaysBetween(parseLocal(p.startDate), parseLocal(p.dueDate)) : -1;
      sorted.sort((a,b) => ganttSort==='dur-asc' ? dur(a)-dur(b) : dur(b)-dur(a));
    } else if(ganttSort === 'stage-asc'){
      sorted.sort((a,b) => a.stage - b.stage);
    }

    const ticks = [];
    const cur = new Date(minStart);
    while(cur.getDay() !== 1) cur.setDate(cur.getDate()-1);
    while(cur <= maxDue){
      const offset = Math.round((cur - minStart)/86400000);
      if(offset >= 0){
        ticks.push({left: offset*ganttDayWidth, label: `${String(cur.getDate()).padStart(2,'0')}.${String(cur.getMonth()+1).padStart(2,'0')}`});
      }
      cur.setDate(cur.getDate()+7);
    }
    const today = new Date(); today.setHours(0,0,0,0);
    const todayOffset = Math.round((today - minStart)/86400000);
    const todayLeft = todayOffset*ganttDayWidth;
    const showToday = today >= minStart && today <= maxDue;

    let html = `<div class="gantt-header-row">
      <div class="gantt-header-spacer"></div>
      <div class="gantt-header-track" style="width:${chartWidth}px;">
        ${ticks.map(t => `<div class="gantt-tick" style="left:${t.left}px;"><span>${t.label}</span></div>`).join('')}
      </div>
    </div>`;

    html += sorted.map(p => {
      const hasDates = p.startDate && p.dueDate && parseLocal(p.dueDate) >= parseLocal(p.startDate);
      let trackInner = '';
      if(hasDates){
        const startOffset = Math.round((parseLocal(p.startDate) - minStart)/86400000);
        const dueOffset = Math.round((parseLocal(p.dueDate) - minStart)/86400000);
        const left = startOffset*ganttDayWidth;
        const width = Math.max(ganttDayWidth*0.6, (dueOffset-startOffset+1)*ganttDayWidth - 2);
        const overdue = parseLocal(p.dueDate) < today;
        const bg = p.color || (overdue ? '#B23A2E' : '#3F5D54');
        trackInner = `<div class="gantt-bar" style="left:${left}px; width:${width}px; background:${bg};" title="${escapeAttr(p.name)}: ${fmtDate(p.startDate)} → ${fmtDate(p.dueDate)}"></div>`;
      } else {
        trackInner = `<div class="gantt-nodate">нет срока</div>`;
      }
      if(showToday){
        trackInner += `<div class="gantt-today" style="left:${todayLeft}px;"></div>`;
      }
      return `<div class="gantt-row">
        <div class="gantt-label" title="${escapeAttr(p.name)}">${escapeHtml(p.name)}</div>
        <div class="gantt-track" style="width:${chartWidth}px;">${trackInner}</div>
      </div>`;
    }).join('');

    ganttChart.innerHTML = html;
  }

  async function patchTaskFields(projectId, taskId, patch){
    const p = projects.find(x => x.id === projectId);
    if(!p) return;
    const newTasks = (p.tasks||[]).map(t => t.id === taskId ? {...t, ...patch} : t);
    p.tasks = newTasks;
    await updateProject(projectId, {tasks:newTasks});
  }

  function dayWord(n){
    const abs = Math.abs(n) % 100;
    const last = abs % 10;
    if(abs >= 11 && abs <= 14) return 'дней';
    if(last === 1) return 'день';
    if(last >= 2 && last <= 4) return 'дня';
    return 'дней';
  }

  function escapeAttr(s){
    return String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  }
  function newTaskId(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }
  function getTasks(id){
    const p = projects.find(x => x.id === id);
    return p ? [...(p.tasks || [])] : [];
  }
  async function saveTasks(id, tasks){
    const p = projects.find(x => x.id === id);
    if(p) p.tasks = tasks;
    await updateProject(id, {tasks});
  }
  async function addTask(cardId, text){
    const tasks = getTasks(cardId);
    tasks.push({id:newTaskId(), text, done:false});
    pendingFocusCardId = cardId;
    await saveTasks(cardId, tasks);
  }

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // ---- event delegation ----
  grid.addEventListener('change', async (e) => {
    const card = e.target.closest('.card');
    if(!card) return;
    const id = card.dataset.id;
    const taskEl = e.target.closest('.task');
    if(taskEl){
      const tid = taskEl.dataset.taskId;
      let tasks = getTasks(id);
      if(e.target.dataset.action === 'toggle-task'){
        tasks = tasks.map(t => t.id === tid ? {...t, done: e.target.checked} : t);
      } else if(e.target.dataset.action === 'edit-task'){
        const text = e.target.value.trim();
        tasks = text ? tasks.map(t => t.id === tid ? {...t, text} : t)
                     : tasks.filter(t => t.id !== tid);
      } else return;
      await saveTasks(id, tasks);
      return;
    }
    const field = e.target.dataset.field;
    if(!field) return;
    if(field === 'startDate' || field === 'dueDate' || field === 'workDays'){
      const p = projects.find(x => x.id === id) || {};
      const patch = {};
      if(field === 'workDays'){
        const n = parseInt(e.target.value, 10);
        if(!Number.isFinite(n) || n <= 0){
          patch.workDays = null;
        } else {
          patch.workDays = n;
          if(p.startDate) patch.dueDate = addWorkingDays(p.startDate, n);
        }
      } else if(field === 'startDate'){
        patch.startDate = e.target.value;
        const n = effectiveWorkDays(p);
        if(patch.startDate && n){
          patch.dueDate = addWorkingDays(patch.startDate, n);
          patch.workDays = n;
        }
      } else { // dueDate — пересчитываем срок
        patch.dueDate = e.target.value;
        if(p.startDate && patch.dueDate){
          const n = workingDaysBetween(parseLocal(p.startDate), parseLocal(patch.dueDate));
          patch.workDays = n > 0 ? n : null;
        }
      }
      Object.assign(p, patch);
      await updateProject(id, patch);
      return;
    }
    let value = e.target.value;
    if(field === 'stage') value = Number(value);
    await updateProject(id, {[field]: value});
  });

  grid.addEventListener('keydown', async (e) => {
    if(e.key !== 'Enter' || e.isComposing) return;
    if(e.target.classList.contains('task-new')){
      e.preventDefault();
      const text = e.target.value.trim();
      if(!text) return;
      e.target.value = '';
      await addTask(e.target.closest('.card').dataset.id, text);
    } else if(e.target.classList.contains('task-text') && !e.shiftKey){
      e.preventDefault();
      e.target.blur(); // сохранит правку через change
    }
  });
  grid.addEventListener('input', (e) => {
    if(e.target.classList.contains('task-text')) autoGrow(e.target);
  });
  grid.addEventListener('focusout', async (e) => {
    if(!e.target.classList.contains('task-new')) return;
    const text = e.target.value.trim();
    if(!text) return;
    const card = e.target.closest('.card');
    if(!card) return;
    e.target.value = '';
    const tasks = getTasks(card.dataset.id);
    tasks.push({id:newTaskId(), text, done:false});
    await saveTasks(card.dataset.id, tasks);
  });

  function closeAllColorMenus(){
    document.querySelectorAll('.color-menu.open').forEach(m => m.classList.remove('open'));
  }
  function closeAllCardMenus(){
    document.querySelectorAll('.card-menu.open').forEach(m => m.classList.remove('open'));
  }

  function startRename(card){
    const id = card.dataset.id;
    const p = projects.find(x => x.id === id);
    const h2 = card.querySelector('.top-row h2');
    if(!h2) return;
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'rename-input';
    input.value = p ? p.name : h2.textContent;
    h2.replaceWith(input);
    input.focus();
    input.select();
    let done = false;
    const finish = async (save) => {
      if(done) return;
      done = true;
      const newName = input.value.trim();
      const h2new = document.createElement('h2');
      h2new.textContent = (save && newName) ? newName : (p ? p.name : '');
      input.replaceWith(h2new);
      if(save && newName && p && newName !== p.name){
        p.name = newName;
        await updateProject(id, {name: newName});
      }
    };
    input.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){ e.preventDefault(); finish(true); }
      else if(e.key === 'Escape'){ e.preventDefault(); finish(false); }
    });
    input.addEventListener('blur', () => finish(true));
  }

  grid.addEventListener('click', async (e) => {
    const toggleBtn = e.target.closest('[data-action="toggle-color"]');
    if(toggleBtn){
      const menu = toggleBtn.closest('.card').querySelector('.color-menu');
      const wasOpen = menu.classList.contains('open');
      closeAllColorMenus();
      closeAllCardMenus();
      if(!wasOpen) menu.classList.add('open');
      return;
    }
    const menuToggle = e.target.closest('[data-action="toggle-menu"]');
    if(menuToggle){
      const menu = menuToggle.closest('.card').querySelector('.card-menu');
      const wasOpen = menu.classList.contains('open');
      closeAllCardMenus();
      closeAllColorMenus();
      if(!wasOpen) menu.classList.add('open');
      return;
    }
    const renameBtn = e.target.closest('[data-action="rename"]');
    if(renameBtn){
      const card = renameBtn.closest('.card');
      closeAllCardMenus();
      startRename(card);
      return;
    }
    const delBtn = e.target.closest('[data-action="del-task"]');
    if(delBtn){
      const id = delBtn.closest('.card').dataset.id;
      const tid = delBtn.closest('.task').dataset.taskId;
      await saveTasks(id, getTasks(id).filter(t => t.id !== tid));
      return;
    }
    const swatch = e.target.closest('[data-action="set-color"]');
    if(swatch){
      const card = swatch.closest('.card');
      const id = card.dataset.id;
      const color = swatch.dataset.color || '';
      closeAllColorMenus();
      await updateProject(id, {color});
      return;
    }
  });

  document.addEventListener('click', (e) => {
    if(!e.target.closest('.dot-btn') && !e.target.closest('.color-menu')){
      closeAllColorMenus();
    }
    if(!e.target.closest('.menu-btn') && !e.target.closest('.card-menu')){
      closeAllCardMenus();
    }
  });

  // ---- drag & drop reorder (Pointer Events — работает и мышью, и пальцем) ----
  grid.addEventListener('pointerdown', (e) => {
    const handle = e.target.closest('.drag-handle');
    if(!handle) return;
    const card = handle.closest('.card');
    if(!card) return;
    e.preventDefault();
    card.classList.add('dragging');
    isDragging = true;

    const onMove = (ev) => {
      const after = getDragAfterElement(grid, ev.clientX, ev.clientY);
      if(after == null){
        grid.appendChild(card);
      } else if(after !== card){
        grid.insertBefore(card, after);
      }
    };
    const onUp = async () => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      card.classList.remove('dragging');
      isDragging = false;
      const ids = [...grid.querySelectorAll('.card')].map(c => c.dataset.id);
      for(let i = 0; i < ids.length; i++){
        const p = projects.find(x => x.id === ids[i]);
        if(p && p.order !== i){
          p.order = i;
          await updateProject(ids[i], {order: i});
        }
      }
    };
    // Слушаем на document, а не на самой карточке: как только карточка
    // переставляется под курсором, события на ней теряются, а на document — нет.
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });

  function getDragAfterElement(container, x, y){
    const cards = [...container.querySelectorAll('.card:not(.dragging)')];
    for(const card of cards){
      const box = card.getBoundingClientRect();
      if(y < box.top) return card;
      if(y >= box.top && y <= box.bottom && x < box.left + box.width/2) return card;
    }
    return null;
  }

  // ---- add form ----
  openAddBtn.addEventListener('click', () => {
    if(document.getElementById('addForm')) return;
    const card = document.createElement('div');
    card.className = 'add-card';
    card.id = 'addForm';
    card.innerHTML = `
      <h3>Новый заказ</h3>
      <label>Название</label>
      <input type="text" id="newName" placeholder="Например: Кухня Иванова">
      <label>Дата начала</label>
      <input type="date" id="newStart">
      <label>Срок изготовления, раб. дней</label>
      <input type="text" inputmode="numeric" id="newDays" placeholder="Например: 20">
      <label>Дата сдачи <span style="opacity:.7">(посчитается сама, можно поправить)</span></label>
      <input type="date" id="newDue">
      <div class="btn-row">
        <button type="button" id="cancelAdd">Отмена</button>
        <button type="button" class="save" id="saveAdd">Добавить</button>
      </div>
    `;
    grid.prepend(card);
    document.getElementById('newName').focus();
    const syncNewDue = () => {
      const st = document.getElementById('newStart').value;
      const n = parseInt(document.getElementById('newDays').value, 10);
      if(st && n > 0) document.getElementById('newDue').value = addWorkingDays(st, n);
    };
    document.getElementById('newStart').addEventListener('change', syncNewDue);
    document.getElementById('newDays').addEventListener('input', syncNewDue);
    document.getElementById('newDue').addEventListener('change', () => {
      const st = document.getElementById('newStart').value;
      const du = document.getElementById('newDue').value;
      if(st && du){
        const n = workingDaysBetween(parseLocal(st), parseLocal(du));
        document.getElementById('newDays').value = n > 0 ? n : '';
      }
    });
    document.getElementById('cancelAdd').onclick = () => card.remove();
    document.getElementById('saveAdd').onclick = async () => {
      const name = document.getElementById('newName').value.trim();
      if(!name){ document.getElementById('newName').focus(); return; }
      const startDate = document.getElementById('newStart').value;
      const dueDate = document.getElementById('newDue').value;
      const nd = parseInt(document.getElementById('newDays').value, 10);
      const workDays = nd > 0 ? nd : null;
      await addProject({name, startDate, dueDate, workDays, stage: 1, order: projects.length});
      card.remove();
    };
  });

  // ---- фильтр Ганта ----
  const GANTT_SORT_LABELS = {
    manual: 'как в карточках',
    'due-asc': 'сначала горящие',
    'due-desc': 'сначала дальние',
    'dur-asc': 'сначала короткие',
    'dur-desc': 'сначала длинные',
    'stage-asc': 'сначала ранние стадии'
  };
  const ganttFilterBtn = document.getElementById('ganttFilterBtn');
  const ganttFilterMenu = document.getElementById('ganttFilterMenu');
  const ganttFilterLabel = document.getElementById('ganttFilterLabel');
  document.getElementById('ganttZoomOut').addEventListener('click', () => {
    ganttDayWidth = Math.max(6, ganttDayWidth - 4);
    renderGantt();
  });
  document.getElementById('ganttZoomIn').addEventListener('click', () => {
    ganttDayWidth = Math.min(48, ganttDayWidth + 4);
    renderGantt();
  });
  ganttFilterBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    ganttFilterMenu.classList.toggle('open');
  });
  ganttFilterMenu.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-sort]');
    if(!btn) return;
    ganttSort = btn.dataset.sort;
    ganttFilterLabel.textContent = GANTT_SORT_LABELS[ganttSort];
    ganttFilterMenu.classList.remove('open');
    renderGantt();
  });
  document.addEventListener('click', (e) => {
    if(!e.target.closest('.filter-wrap')) ganttFilterMenu.classList.remove('open');
  });

  // ---- доска задач: отметка выполнения ----
  const tasksBoard = document.getElementById('tasksBoard');
  tasksBoard.addEventListener('change', async (e) => {
    if(e.target.dataset.action !== 'toggle-board-task') return;
    const el = e.target.closest('.board-task');
    await patchTaskFields(el.dataset.projectId, el.dataset.taskId, {done: e.target.checked});
  });

  // ---- доска задач: перетаскивание между колонками ----
  tasksBoard.addEventListener('pointerdown', (e) => {
    if(e.target.closest('input[type=checkbox]')) return;
    const item = e.target.closest('.board-task');
    if(!item) return;
    e.preventDefault();
    item.classList.add('dragging');
    isDragging = true;

    const onMove = (ev) => {
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      const col = under && under.closest('.board-col-body');
      if(!col) return;
      const after = getVerticalAfterElement(col, ev.clientY);
      if(after == null) col.appendChild(item);
      else if(after !== item) col.insertBefore(item, after);
    };
    const onUp = async () => {
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);
      item.classList.remove('dragging');
      isDragging = false;

      for(const col of tasksBoard.querySelectorAll('.board-col-body')){
        const zoneKey = col.dataset.zoneBody;
        const els = [...col.querySelectorAll('.board-task')];
        for(let i = 0; i < els.length; i++){
          const el = els[i];
          const projectId = el.dataset.projectId, taskId = el.dataset.taskId;
          const p = projects.find(x => x.id === projectId);
          const t = p && (p.tasks||[]).find(x => x.id === taskId);
          if(!t) continue;
          if(zoneKey === 'unassigned'){
            if(t.zone){ await patchTaskFields(projectId, taskId, {zone:null}); }
          } else if(t.zone !== zoneKey || t.zoneOrder !== i){
            await patchTaskFields(projectId, taskId, {zone:zoneKey, zoneOrder:i});
          }
        }
      }
    };
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });

  function getVerticalAfterElement(container, y){
    const items = [...container.querySelectorAll('.board-task:not(.dragging)')];
    for(const el of items){
      const box = el.getBoundingClientRect();
      if(y < box.top + box.height/2) return el;
    }
    return null;
  }

  // ---- хранилище (Firebase Firestore, либо демо-режим без сохранения) ----
  async function addProject(data){
    if(!isConfigured){
      data = {...data, id: 'local-' + Date.now()};
      projects.push(data);
      render();
      return;
    }
    await fx.addDoc(colRef, data);
  }
  async function updateProject(id, patch){
    if(!isConfigured){
      const p = projects.find(x => x.id === id);
      if(p) Object.assign(p, patch);
      render();
      return;
    }
    await fx.updateDoc(fx.doc(db, 'projects', id), patch);
  }

  async function initFirebase(){
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    const fs = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const app = initializeApp(firebaseConfig);
    db = fs.getFirestore(app);
    fx = fs;
    colRef = fs.collection(db, 'projects');

    let seeded = false;
    fs.onSnapshot(colRef, async (snap) => {
      projects = snap.docs.map(d => ({id: d.id, ...d.data()}));
      if(projects.length === 0 && !seeded){
        seeded = true;
        for(const p of SEED_PROJECTS){
          await fx.addDoc(colRef, p);
        }
        return; // следующий snapshot отрисует уже с данными
      }
      render();
    }, (err) => {
      banner.innerHTML = 'Не удалось подключиться к базе данных: ' + err.message + '. Проверьте конфиг Firebase и правила доступа Firestore.';
    });
  }

  if(isConfigured){
    initFirebase();
  } else {
    banner.innerHTML = 'Firebase не настроен: изменения не будут сохраняться и не будут видны другим. Откройте файл и вставьте конфиг вашего проекта Firebase в начало script-блока.';
    projects = SEED_PROJECTS.map((p,i) => ({id:'local-'+i, ...p}));
    render();
  }
</script>
</body>
</html>
